name: Diag Supabase access
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Long-shot routes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          REF=$(echo "$SUPABASE_URL" | sed 's|https://||;s|\.supabase\.co.*||')
          echo "ref=$REF"
          echo "== 1. Management API with project secret key =="
          curl -s -m 15 "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -o /tmp/mgmt.json -w "HTTP %{http_code} "; head -c 150 /tmp/mgmt.json; echo
          echo "== 2. direct db host =="
          dig +short "db.$REF.supabase.co" | head -3
          echo "== 3. pooler/direct postgres with secret key as password (long shot) =="
          for host in "aws-0-us-east-1.pooler.supabase.com" "aws-0-us-east-2.pooler.supabase.com" "aws-0-us-west-1.pooler.supabase.com" "db.$REF.supabase.co"; do
            printf "%s: " "$host"
            PGPASSWORD="$SUPABASE_SECRET_KEY" psql -h "$host" -p 6543 -U "postgres.$REF" -d postgres -c 'select 1' -t 2>&1 | head -1
          done
