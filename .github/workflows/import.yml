name: Import staged menu

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Staged bundle to import (imports/<name>.json)'
        required: true
        default: 'imports/colectivo.json'

concurrency:
  group: coffee-menu-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import staged menu bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/import_menu.py "${{ inputs.file }}"
