name: Collect coffee prices

on:
  workflow_dispatch:
    inputs:
      missing_only:
        description: Only check shops with no prices on file yet
        type: boolean
        default: false
  schedule:
    - cron: '30 0 * * *'

concurrency:
  group: coffee-price-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover shops and collect direct menus
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
          MISSING_ONLY: ${{ github.event.inputs.missing_only }}
        run: python scripts/collect.py
