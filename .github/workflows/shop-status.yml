name: Update shop status

on:
  workflow_dispatch:
    inputs:
      shop_id:
        description: 'Shop id to update'
        required: true
      closed_on:
        description: 'Closed date YYYY-MM-DD (blank = today; ignored with reopen)'
        required: false
        default: ''
      reopen:
        description: 'Clear closed_at instead of setting it'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update shop status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/set_shop_closed.py --shop-id "${{ inputs.shop_id }}" --closed-on "${{ inputs.closed_on }}" ${{ inputs.reopen && '--reopen' || '' }}
